_subdirectory: template

install_hooks:
  type: bool
  default: true
  help: "Run 'lefthook install' after rendering to write .git/hooks/."

# lefthook.yml carries only the extends glob; a project that has written its own
# hook config keeps it.
_skip_if_exists:
  - lefthook.yml

_tasks:
  - command: lefthook install
    when: "{{ install_hooks }}"
