_subdirectory: template

python_version:
  type: str
  default: "3.14"
  help: "Python version the CI jobs install. Match what the python language package uses."

python_pkg_manager:
  type: str
  choices:
    - uv
    - pdm
  default: uv
  help: "Package manager the CI jobs install dependencies with. Match the python language package."

python_test_command:
  type: str
  default: pytest
  help: "Command the test job runs, without the package-manager prefix."

python_type_checker:
  type: str
  choices:
    - none
    - mypy
    - pyright
    - ty
  default: none
  help: "Type checker the lint job runs. none omits the step."

ci_cache:
  type: bool
  default: true
  help: "Cache the dependency install between runs."

ci_os_matrix:
  type: yaml
  default: []
  help: "Extra runner images beyond ubuntu-latest, as a yaml list. Each entry multiplies runner minutes."

ci_version_matrix:
  type: yaml
  default: []
  help: "Python versions to test against, as a yaml list. Empty tests only python_version."
