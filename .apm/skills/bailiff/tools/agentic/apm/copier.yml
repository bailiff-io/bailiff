_subdirectory: template

project_name:
  type: str
  default: ""
  help: "Project name. Becomes the apm.yml name field."

description:
  type: str
  default: ""
  help: "One-line description for apm.yml. Empty derives one from project_name."

# Open list, no choices: the package carries no package catalog. Each entry is a
# locator of the form owner/repo/packages/name#constraint.
apm_packages:
  type: yaml
  default: []
  validator: >-
    {% if apm_packages | length == 0 %}apm needs at least one package locator in
    apm_packages. Supply the list, or drop this package from the selection.{% endif %}
  help: "APM package locators shaped owner/repo/packages/name#constraint."

apm_target:
  type: str
  default: "claude,codex"
  help: "Comma-separated harnesses apm install deploys to. Match the agentic_targets answer."

apm_cli_version:
  type: str
  default: "0.25.0"
  help: "APM CLI version the install task pins in the `uvx --from` argument."

_tasks:
  - "uvx --from apm-cli=={{ apm_cli_version }} apm install"
