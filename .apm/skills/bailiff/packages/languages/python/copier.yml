_subdirectory: template

project_name:
  type: str
  default: ""
  help: "Project name. Used as the package name passed to uv/pdm init."

description:
  type: str
  default: ""
  help: "One-line project description."

python_pkg_manager:
  type: str
  choices:
    - uv
    - pdm
  default: uv
  help: "Package manager that writes pyproject.toml."

python_version:
  type: str
  choices:
    - "3.14"
    - "3.13"
    - "3.12"
    - "3.11"
  default: "3.14"
  help: "Python version. Pins requires-python, ruff target-version, and the mise tool."

python_layout:
  type: str
  choices:
    - src
    - flat
  default: src
  help: "Layout: src (uv init --package, installable) or flat."

python_framework:
  type: str
  choices:
    - none
    - fastapi
    - django
    - flask
  default: none
  help: "Framework. Recorded in the answers file; no scaffolding branch."

ruff_line_length:
  type: str
  choices:
    - "79"
    - "88"
    - "100"
    - "119"
    - "120"
  default: "88"
  help: "Ruff line-length written to ruff.toml."

ruff_quote_style:
  type: str
  choices:
    - double
    - single
  default: double
  help: "Ruff format.quote-style."

ruff_rule_profile:
  type: str
  choices:
    - standard
    - strict
  default: standard
  help: "standard = [E, F, I, N, W, UP, B, SIM, TC]; strict adds [ANN, RUF, PERF, C4, PT]."

# mypy is the reference implementation and what ci/github-python invokes. Before
# this answer existed the CI lint job ran `uv run mypy .` while nothing installed
# mypy, so the job failed on a missing binary rather than on a type error.
python_type_checker:
  type: str
  choices:
    - mypy
    - ty
    - pyright
    - none
  default: mypy
  help: "Type checker, added to the dev dependencies and configured in pyproject.toml. ty is Astral's, still 0.0.x."

python_coverage:
  type: bool
  default: true
  help: "Add pytest-cov and a coverage config."

python_coverage_min:
  type: int
  default: 0
  when: "{{ python_coverage }}"
  help: "Fail under this line percentage. 0 records coverage without enforcing a floor."

# deptry reads the imports and compares them against the declared dependencies,
# so it reports unused, missing, and transitive ones. The Python counterpart to
# cargo-machete.
python_dep_check:
  type: bool
  default: true
  help: "Add deptry to detect unused, missing, and transitively-used dependencies."

# Docstring presence warns; a docstring that contradicts the signature fails.
# ruff cannot mix severities in one run, so the hook invokes it twice: once
# blocking, once with --exit-zero for the D rules.
python_docstring_check:
  type: str
  choices:
    - warn
    - enforce
    - none
  default: warn
  help: "Docstring presence (ruff D). warn reports without failing; enforce fails the commit."

# DOC rules are ruff's pydoclint port: they check the documented params, returns,
# and raises against the real signature, which is what catches a docstring that
# drifted after a refactor.
python_docstring_accuracy:
  type: bool
  default: true
  help: "Fail when a docstring's documented params, returns, or raises disagree with the signature (ruff DOC)."

python_doctest:
  type: bool
  default: false
  help: "Run docstring examples as tests (pytest --doctest-modules), so a stale example fails."

# Python has no builtin multi-version test runner. The CI matrix covers most
# projects; nox is for verifying the matrix locally before pushing, which matters
# for a library published to PyPI.
python_multiversion:
  type: str
  choices:
    - none
    - nox
  default: none
  help: "Local multi-version test runner. Offer nox when the project publishes a library supporting several Python versions."

add_tests:
  type: bool
  default: false
  help: "Add tests/ with a pytest example."

ruff_version:
  type: str
  default: "v0.16.0"
  help: "Rev for astral-sh/ruff-pre-commit in .pre-commit.d/python.yaml."

_skip_if_exists:
  - pyproject.toml
  - tests/test_example.py

_tasks:
  # git has no include directive, so the .gitignore.d fragment is inert until
  # it is folded in. Idempotent and order-independent.
  - 'python3 "{{ _copier_conf.src_path }}/../../../scripts/fold_gitignore.py"'
  # mise trust precedes install: a freshly rendered .mise/conf.d is untrusted and
  # `mise install` would refuse to read it.
  - mise trust --yes && mise install
  - command: >-
      test -f pyproject.toml ||
      uv init
      --name "{{ project_name | default('project', true) | lower | replace(' ', '-') | replace('_', '-') }}"
      --python {{ python_version }} --package --no-readme
    when: "{{ python_pkg_manager == 'uv' and python_layout == 'src' }}"
  - command: >-
      test -f pyproject.toml ||
      uv init
      --name "{{ project_name | default('project', true) | lower | replace(' ', '-') | replace('_', '-') }}"
      --python {{ python_version }} --no-readme
    when: "{{ python_pkg_manager == 'uv' and python_layout == 'flat' }}"
  - command: >-
      test -f pyproject.toml ||
      pdm init --non-interactive --python {{ python_version }}
    when: "{{ python_pkg_manager == 'pdm' }}"
  # Dev tooling as a dependency group, so the hooks and the CI jobs run tools the
  # project actually installs. Before this, ci/github-python invoked `uv run mypy`
  # while nothing added mypy, and the job failed on a missing binary rather than
  # on a type error.
  #
  # copier.yml is parsed as YAML before jinja renders it, so the tool list is one
  # inline expression rather than a set of {% set %} blocks.
  - command: >-
      uv add --dev
      {% if python_type_checker != 'none' %}{{ python_type_checker }} {% endif %}
      {%- if add_tests %}pytest {% endif %}
      {%- if python_coverage %}pytest-cov {% endif %}
      {%- if python_dep_check %}deptry {% endif %}
      {%- if python_multiversion == 'nox' %}nox{% endif %}
    when: >-
      {{ python_pkg_manager == 'uv' and (python_type_checker != 'none' or add_tests
      or python_coverage or python_dep_check or python_multiversion == 'nox') }}
  - command: >-
      pdm add --dev
      {% if python_type_checker != 'none' %}{{ python_type_checker }} {% endif %}
      {%- if add_tests %}pytest {% endif %}
      {%- if python_coverage %}pytest-cov {% endif %}
      {%- if python_dep_check %}deptry {% endif %}
      {%- if python_multiversion == 'nox' %}nox{% endif %}
    when: >-
      {{ python_pkg_manager == 'pdm' and (python_type_checker != 'none' or add_tests
      or python_coverage or python_dep_check or python_multiversion == 'nox') }}
