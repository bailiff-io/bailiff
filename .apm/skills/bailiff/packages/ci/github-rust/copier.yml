_subdirectory: template

rust_toolchain:
  type: str
  choices:
    - stable
    - beta
    - nightly
    - "1.90.0"
    - "1.85.0"
  default: stable
  help: "Rust toolchain the CI jobs install. A pinned version keeps a clippy release from breaking an unrelated commit."

rust_test_command:
  type: str
  default: "test --workspace"
  help: "Cargo subcommand the test job runs, without the leading cargo. Use nextest run if the project uses nextest."

rust_all_features:
  type: bool
  default: true
  help: "Pass --all-features to test and clippy. Turn it off when features are mutually exclusive."

ci_cache:
  type: bool
  default: true
  help: "Cache the cargo registry and target directory between runs, via rust-cache."

ci_os_matrix:
  type: str
  multiselect: true
  choices:
    - ubuntu-latest
    - ubuntu-24.04-arm
    - macos-latest
    - windows-latest
  default:
    - ubuntu-latest
  help: "Runner images the test job builds a matrix from. Each extra entry multiplies runner minutes."

ci_version_matrix:
  type: str
  multiselect: true
  choices:
    - stable
    - beta
    - nightly
    - "1.90.0"
    - "1.85.0"
  default: []
  help: "Toolchains to test against. Empty tests only rust_toolchain. Add the crate MSRV alongside stable."

ci_job_timeout_minutes:
  type: int
  default: 15
  help: "Per-job timeout. GitHub defaults to 360, so a hung job burns six runner hours before it is killed."
