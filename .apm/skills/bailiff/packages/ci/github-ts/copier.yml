_subdirectory: template

node_version:
  type: str
  choices:
    - "24"
    - "22"
    - "20"
  default: "24"
  help: "Node version the CI jobs install. Match what the ts language package uses."

ts_pkg_manager:
  type: str
  choices:
    - pnpm
    - bun
    - npm
  default: pnpm
  help: "Package manager the CI jobs install dependencies with. Match the ts language package."

ts_test_command:
  type: str
  default: test
  help: "Package script the test job runs, without the run prefix."

ts_linter:
  type: str
  choices:
    - biome
    - eslint
    - none
  default: biome
  help: "Linter the lint job runs. biome covers format and lint in one step."

ts_typecheck:
  type: bool
  default: true
  help: "Run tsc --noEmit in the lint job."

ci_cache:
  type: bool
  default: true
  help: "Cache the dependency install between runs."

ci_os_matrix:
  type: str
  multiselect: true
  choices:
    - ubuntu-latest
    - ubuntu-24.04-arm
    - macos-latest
    - windows-latest
  default:
    - ubuntu-latest
  help: "Runner images the test job builds a matrix from. Each extra entry multiplies runner minutes."

ci_version_matrix:
  type: str
  multiselect: true
  choices:
    - "24"
    - "22"
    - "20"
  default: []
  help: "Node versions to test against. Empty tests only node_version."
