_subdirectory: template

python_version:
  type: str
  choices:
    - "3.14"
    - "3.13"
    - "3.12"
    - "3.11"
    - "3.10"
  default: "3.14"
  help: "Python version the CI jobs install. Match what the python language package uses."

python_pkg_manager:
  type: str
  choices:
    - uv
    - pdm
  default: uv
  help: "Package manager the CI jobs install dependencies with. Match the python language package."

python_test_command:
  type: str
  default: pytest
  help: "Command the test job runs, without the package-manager prefix."

python_type_checker:
  type: str
  choices:
    - none
    - mypy
    - pyright
    - ty
  default: none
  help: "Type checker the lint job runs. none omits the step."

ci_cache:
  type: bool
  default: true
  help: "Cache the dependency install between runs."

ci_os_matrix:
  type: str
  multiselect: true
  choices:
    - ubuntu-latest
    - ubuntu-24.04-arm
    - macos-latest
    - windows-latest
  default:
    - ubuntu-latest
  help: "Runner images the test job builds a matrix from. Each extra entry multiplies runner minutes."

ci_version_matrix:
  type: str
  multiselect: true
  choices:
    - "3.14"
    - "3.13"
    - "3.12"
    - "3.11"
    - "3.10"
  default: []
  help: "Python versions to test against. Empty tests only python_version."

ci_job_timeout_minutes:
  type: int
  default: 15
  help: "Per-job timeout. GitHub defaults to 360, so a hung job burns six runner hours before it is killed."
