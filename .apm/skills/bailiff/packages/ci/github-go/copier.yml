_subdirectory: template

go_version:
  type: str
  choices:
    - "1.26"
    - "1.25"
    - "1.24"
  default: "1.26"
  help: "Go version the CI jobs install. Match the go directive in go.mod."

go_race:
  type: bool
  default: true
  help: "Run tests with -race. Catches data races; roughly doubles test time."

go_coverage:
  type: bool
  default: false
  help: "Write a coverage profile in the test job."

ci_cache:
  type: bool
  default: true
  help: "Cache modules and build output between runs, via setup-go."

ci_os_matrix:
  type: str
  multiselect: true
  choices:
    - ubuntu-latest
    - ubuntu-24.04-arm
    - macos-latest
    - windows-latest
  default:
    - ubuntu-latest
  help: "Runner images the test job builds a matrix from. Each extra entry multiplies runner minutes."

ci_version_matrix:
  type: str
  multiselect: true
  choices:
    - "1.26"
    - "1.25"
    - "1.24"
  default: []
  help: "Go versions to test against. Empty tests only go_version."

ci_job_timeout_minutes:
  type: int
  default: 15
  help: "Per-job timeout. GitHub defaults to 360, so a hung job burns six runner hours before it is killed."
