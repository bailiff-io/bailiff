_subdirectory: template

project_name:
  type: str
  default: ""
  help: "Project name; used for the created repository name."

org:
  type: str
  default: ""
  help: "GitHub owner or team handle written into .github/CODEOWNERS."

# GitHub's community-health checklist wants all three. A public repo with no
# SECURITY.md offers no documented way to report a vulnerability privately, which
# is the one of the three with a real consequence.
community_health:
  type: bool
  default: true
  help: "Render SECURITY.md, CONTRIBUTING.md, and CODE_OF_CONDUCT.md."

security_contact:
  type: str
  default: ""
  when: "{{ community_health }}"
  help: "Where to report a vulnerability privately. Empty uses GitHub's private reporting form, which needs enabling in repo settings."

supported_versions:
  type: str
  default: "the latest release"
  when: "{{ community_health }}"
  help: "Which versions receive security fixes, as prose for the SECURITY.md table."

coc_contact:
  type: str
  default: ""
  when: "{{ community_health }}"
  help: "Where to report a code-of-conduct violation. Empty renders a placeholder the user must fill in."

# CONTRIBUTING.md names the project's real commands, so it has to match what the
# hooks and task-runner packages rendered.
contributing_hook_manager:
  type: str
  choices:
    - prek
    - pre-commit
    - lefthook
    - none
  default: prek
  when: "{{ community_health }}"
  help: "Hook manager CONTRIBUTING.md tells a contributor to install. Match hooks/manager."

contributing_task_runner:
  type: str
  choices:
    - just
    - task
    - none
  default: none
  when: "{{ community_health }}"
  help: "Task runner CONTRIBUTING.md names. Match the workspace package."

create_remote:
  type: bool
  default: false
  help: "Run 'gh repo create' after rendering. false renders .github/ only."

visibility:
  type: str
  choices:
    - private
    - public
    - internal
  default: private
  help: "Repository visibility. 'public' requires the public_confirm answer."

public_confirm:
  type: str
  default: ""
  help: "Type the project name to confirm a public repository. Required only when visibility is public and create_remote is true."

remote_protocol:
  type: str
  choices:
    - https
    - ssh
  default: https
  help: "Remote URL protocol for the created remote."

push_after_create:
  type: bool
  default: false
  help: "Push the current branch to origin after the repository is created."

team:
  type: str
  default: ""
  help: "GitHub team slug to grant access after creation. Empty omits --team."

# gh is deliberately absent from requires_bin: a missing gh skips remote
# creation and leaves the rendered .github/ files in place.
# All three are edited after the fact -- a contact address, a version table, a
# project-specific rule -- so a re-render must not overwrite them.
_skip_if_exists:
  - SECURITY.md
  - CONTRIBUTING.md
  - CODE_OF_CONDUCT.md

_tasks:
  - command: >-
      command -v gh >/dev/null 2>&1 ||
      { echo "github-repo: gh not found; skipping repo creation." >&2; exit 0; }
    when: "{{ create_remote }}"

  - command: >-
      gh config set git_protocol {{ remote_protocol }}
      || { echo "github-repo: gh config set git_protocol failed; continuing." >&2; exit 0; }
    when: "{{ create_remote }}"

  - command: >-
      gh repo create
      --source .
      --remote origin
      --{{ visibility }}
      {% if team %}--team {{ team }}{% endif %}
      || { echo "github-repo: gh repo create failed; create the remote by hand." >&2; exit 0; }
    when: "{{ create_remote }}"

  - command: >-
      git push -u origin HEAD
      || { echo "github-repo: git push failed; push by hand." >&2; exit 0; }
    when: "{{ create_remote and push_after_create }}"
