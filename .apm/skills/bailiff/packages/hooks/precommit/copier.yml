_subdirectory: template

enforce_conventional_commits:
  type: bool
  default: true
  help: "Add a commit-msg hook that enforces Conventional Commits."

enable_typo_check:
  type: bool
  default: true
  help: "Add a typo-check hook (crate-ci/typos)."

precommit_exclude_patterns:
  type: yaml
  default: []
  help: "Regex patterns joined into the config's top-level exclude (yaml list)."

install_hooks:
  type: bool
  default: true
  help: "Run 'pre-commit install' after rendering to write .git/hooks/."

# pre-commit reads one config file and ignores unknown top-level keys, so the
# .pre-commit.d/ fragments need this merge before pre-commit sees them.
_tasks:
  - "python3 {{ _copier_conf.src_path }}/tasks/merge_precommit.py"
  - command: pre-commit install
    when: "{{ install_hooks }}"
