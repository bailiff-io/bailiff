_subdirectory: template

enforce_conventional_commits:
  type: bool
  default: true
  help: "Add a commit-msg hook that enforces Conventional Commits."

enable_typo_check:
  type: bool
  default: true
  help: "Add a typo-check hook (crate-ci/typos)."

precommit_exclude_patterns:
  type: yaml
  default: []
  help: "Regex patterns joined into the config's top-level exclude (yaml list)."

install_hooks:
  type: bool
  default: true
  help: "Run 'prek install' after rendering to write .git/hooks/."

# prek reads .pre-commit-config.yaml and has no include directive either, so the
# .pre-commit.d/ fragments need the same merge before prek sees them.
_tasks:
  - "python3 {{ _copier_conf.src_path }}/tasks/merge_precommit.py"
  - command: prek install
    when: "{{ install_hooks }}"
