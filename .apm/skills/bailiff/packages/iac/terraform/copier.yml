_subdirectory: template

project_name:
  type: str
  default: ""
  help: "Project name. Appears in the commented S3 backend key example."

tf_flavor:
  type: str
  choices:
    - terraform
    - opentofu
  default: terraform
  help: "IaC flavor: terraform (HashiCorp) or opentofu (CNCF fork)."

terraform_version:
  type: str
  default: "1.12.2"
  when: "{{ tf_flavor == 'terraform' }}"
  help: "Terraform version to pin in required_version and the mise fragment."

opentofu_version:
  type: str
  default: "1.10.0"
  when: "{{ tf_flavor == 'opentofu' }}"
  help: "OpenTofu version to pin in required_version and the mise fragment."

tflint_version:
  type: str
  default: "0.57.0"
  help: "tflint version to pin in the mise fragment."

# pre-commit requires a rev per repo, so the default is a real tag. An empty
# answer renders an empty rev for the user to fill in.
pre_commit_terraform_rev:
  type: str
  default: "v1.108.0"
  help: "Tag for antonbabenko/pre-commit-terraform in the pre-commit fragment."

placement_dir:
  type: str
  default: "infrastructure"
  help: "Subdirectory for the Terraform files. Use a single dot for an IaC-only repo."

# Starter skeletons the project edits: re-rendering would drop real resource,
# variable, and backend definitions.
_skip_if_exists:
  - "{{ placement_dir }}/main.tf"
  - "{{ placement_dir }}/variables.tf"
  - "{{ placement_dir }}/outputs.tf"
  - "{{ placement_dir }}/backend.tf"
  - "{{ placement_dir }}/terraform.tfvars.example"

_tasks:
  # git has no include directive, so the .gitignore.d fragment is inert until
  # it is folded in. Idempotent and order-independent.
  - 'python3 "{{ _copier_conf.src_path }}/../../../scripts/fold_gitignore.py"'
