[project]
name = "bailiff"
version = "2.0.0"
description = "Agentic project setup -- a skill that conducts copier, one tool package at a time."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Sjors Robroek" }]
dependencies = [
    "copier>=9.16,<10",
    "python-frontmatter>=1.1,<2",
    "pyyaml>=6,<7",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "hypothesis>=6,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: renders real templates; needs the declared binaries and a network",
]

[tool.ruff]
target-version = "py311"
line-length = 100
